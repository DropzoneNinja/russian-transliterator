server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    autoindex off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fingerprinted build output and self-hosted fonts: cache aggressively.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Service worker and manifest must be re-checked so updates are seen.
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Never serve source maps in production.
    location ~* \.map$ {
        return 404;
    }

    # SPA fallback. index.html itself must not be cached so clients pick up
    # new builds promptly.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
